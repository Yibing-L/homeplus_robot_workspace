d405_obstacle_cloud:
  ros__parameters:
    camera_role: "d405_end_effector"
    depth_topic: "/cameras/d405/aligned_depth_to_color/image_raw"
    camera_info_topic: "/cameras/d405/color/camera_info"
    mask_topic: "/object_mask"
    fallback_frame: "d405_color_optical_frame"
    # Preserve the optical frame so MoveIt's updater gets the true sensor
    # origin for ray clearing. Filtering is evaluated in base_link coordinates.
    output_frame: ""
    filter_frame: "base_link"
    full_cloud_topic: "/vision/clouds/d405/full"
    object_cloud_topic: "/vision/clouds/d405/target"
    obstacle_cloud_topic: "/obstacle_cloud"
    pixel_stride: 4
    max_publish_rate_hz: 1.0
    # Median of 9 settled frames (~2 s at 5 fps): table depth at ~1 m jumps ~4 cm
    # frame to frame; single-frame outliers become voxels above the table.
    depth_median_frames: 9
    min_depth_m: 0.12
    max_depth_m: 2.0
    depth_consistency_threshold_m: 0.04
    depth_consistency_min_neighbors: 2
    # Exclude the floor/contact band and observations above the robot's useful
    # manipulation volume. Both values are expressed in filter_frame.
    obstacle_min_z_m: 0.05
    obstacle_max_z_m: 1.80
    stats_interval_sec: 5.0
    # Preserve settled-view target masks; every cloud uses acquisition-time TF.
    pause_during_motion: true
    motion_status_topic: "/arduino/status"
    # Only remove the segmented target; retain nearby appliance/table surfaces.
    mask_dilation_pixels: 2
    target_padding_m: 0.0
    # Do not erase an appliance-sized neighborhood around the button.
    button_task_id: 2
    button_target_padding_m: 0.0
    # Retain the most recent mask between MolmoPoint inference cycles and
    # across an occasional frame with no point/segmentation result.
    mask_timeout_sec: 15.0
    clear_octomap_on_mask: false
    # Model the table as an exact box instead of 2 cm voxels (see table_plane.py).
    table_plane_enable: true
    table_world_frame: "world"
    table_z_min_m: 0.40
    table_z_max_m: 1.20
    table_max_tilt_deg: 3.0  # a level table reads ~2 deg at D405 range; a bumped camera far more
    table_inlier_tol_m: 0.01
    table_min_inliers: 150
    table_remove_below_m: 0.04
    # 3 cm: the table reads 2-3 cm apart across the D405 view (hand-camera
    # calibration); at 1.5 cm its near part stayed in the map as voxels (2026-10-30).
    table_remove_above_m: 0.03
    table_box_thickness_m: 0.04
    # Level table: fit its height only (D405 noise at ~1 m skews a full 3D fit).
    table_assume_level: true
    # Reuse the last table for frames that miss it, so its voxels don't come back.
    table_hold_sec: 10.0
    # The mask stops short of the table; clear the target's base column down to it.
    table_target_max_radius_m: 0.08
    table_target_margin_m: 0.01

