# Central registry for task-driven perception and motion dispatch.
#
# `caption` is the object phrase passed to MolmoPoint. The detector adds the
# pointing instruction automatically (for example, "red cup" becomes
# "Point to red cup"). Tasks without a command are perception-only until a
# corresponding sequence is added to gesture_execution_map.yaml.
tasks:
  1:
    name: pick_up_red_cup
    caption: red cup
    command_name: pick_up_coffee
    command_type: sequence

  2:
    name: press_square_button
    # Both buttons are silver; name the shape and place (2026-10-30).
    caption: the rectangular silver button on the coffee machine
    command_name: press_square_button
    command_type: sequence

  3:
    name: locate_aluminum_shelf
    caption: the aluminum shelf

  4:
    name: locate_coffee_machine_handle
    caption: the handle on the aluminum coffee machine

  5:
    name: locate_cup_on_shelf
    caption: the coffee cup on the aluminum shelf

  6:
    name: locate_coffee_cup
    caption: the coffee cup

  # Place the held cup (after pick_up_coffee). `target_geometry:
  # horizontal_surface` makes the detector publish the centroid of the visible
  # masked surface at its median measured height (a point ON the tray), not a
  # cup-style body centre.
  7:
    name: place_cup_on_drip_tray
    # "coffee machine drip tray" alternated with the dispensing recess 15 cm higher
    # (2026-10-29); naming the base kept 7/7 detections on the tray.
    caption: the round drip tray at the base of the coffee machine
    target_geometry: horizontal_surface
    command_name: place_cup_on_drip_tray
    command_type: sequence

  # Round button on top of the coffee machine, pressed from above (task 8).
  8:
    name: press_round_button
    caption: the round silver button on top of the coffee machine
    target_geometry: horizontal_surface
    command_name: press_round_button
    command_type: sequence
