# ArUco Detection Configuration
# THIS IS THE SINGLE SOURCE OF TRUTH for default parameter values
# Launch arguments can override these at runtime

# ArUco Dictionary Types:
# 0: DICT_4X4_50 (recommended for small markers)
# 1: DICT_4X4_100
# 2: DICT_4X4_250
# 3: DICT_4X4_1000
# 4: DICT_5X5_50
# 5: DICT_5X5_100
# 6: DICT_5X5_250
# 7: DICT_5X5_1000
# 8: DICT_6X6_50
# 9: DICT_6X6_100
# 10: DICT_6X6_250
# 11: DICT_6X6_1000
# 12: DICT_7X7_50
# 13: DICT_7X7_100
# 14: DICT_7X7_250
# 15: DICT_7X7_1000

aruco_detector:
  ros__parameters:
    # CRITICAL: These must match your physical setup
    aruco_dict_type: 10        
    marker_size: 0.05
    image_topic: "/camera/camera/color/image_raw"  # Set to match your camera output
    # Frame names - adjust to match your robot's TF tree
    camera_frame: "camera_color_optical_frame"
    base_frame: "base_link"
    
    # Detection parameters (optional fine-tuning)
    adaptiveThreshWinSizeMin: 3
    adaptiveThreshWinSizeMax: 23
    adaptiveThreshWinSizeStep: 10
    adaptiveThreshConstant: 7
    minMarkerPerimeterRate: 0.03
    maxMarkerPerimeterRate: 4.0
    polygonalApproxAccuracyRate: 0.03
    minCornerDistanceRate: 0.05
    minDistanceToBorder: 3
    minMarkerDistanceRate: 0.05
    cornerRefinementMethod: 0  # 0=None, 1=Subpix, 2=Contour, 3=AprilTag
    cornerRefinementWinSize: 5
    cornerRefinementMaxIterations: 30
    cornerRefinementMinAccuracy: 0.1

aruco_pose_publisher:
  ros__parameters:
    target_frame: "base_link"
    source_frame: "aruco_0"   # Default to marker ID 0
