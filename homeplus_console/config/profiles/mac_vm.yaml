# Mac profile: ROS in the UTM VM, D405 streamed from macOS, Arduino via tools/arduino_serial_bridge,
# MolmoPoint on the AWS GPU through the SSH tunnel. Commands run as `bash -lc` under systemd --user.
serial_bridge: true
gpu_health_url: http://192.168.64.1:8765/health
env: &env
  FASTRTPS_DEFAULT_PROFILES_FILE: /home/evagish/d405_fastdds.xml
setup: &setup "source /opt/ros/humble/setup.bash && source ~/ros2_ws/install/setup.bash"
units:
  hp-tf:
    env: *env
    cmd: "source /opt/ros/humble/setup.bash && source ~/ros2_ws/install/setup.bash && ros2 launch homeplus_urdf_description state_publisher.launch.py use_gui:=false publish_joint_states:=false"
  hp-camera-rx:
    env: *env
    cmd: "source /opt/ros/humble/setup.bash && python3 ~/d405_vm_receiver.py"
  hp-serial-vm:
    cmd: "~/ros2_ws/src/homeplus_robot_workspace/tools/arduino_serial_bridge/vm_serial_client.sh"
  hp-vision:
    env: *env
    cmd: "source /opt/ros/humble/setup.bash && source ~/ros2_ws/install/setup.bash && ros2 launch homeplus_vision vision_pipeline.launch.py side_mount:=left task_id:=1 enable_d405:=false enable_d435i:=false enable_d455:=false enable_target_detection:=true enable_gesture_detection:=false enable_d405_octomap:=true enable_d435i_octomap:=false enable_d455_octomap:=false"
  hp-moveit:
    env: *env
    cmd: "source /opt/ros/humble/setup.bash && source ~/ros2_ws/install/setup.bash && ros2 launch homeplus_moveit_config gesture_control.launch.py run_arduino:=false launch_obstacle_cloud:=false use_octomap:=true use_rviz:=false"
  hp-bridge:
    env: *env
    # arduino_bridge.launch.py (§7.6) doesn't exist yet; until it does, run the node directly.
    cmd: "source /opt/ros/humble/setup.bash && source ~/ros2_ws/install/setup.bash && ros2 run homeplus_moveit_config arduino_reader.py --port $HOME/ttyArduino --baud 115200 --ros-args -r __node:=arduino_bridge"
