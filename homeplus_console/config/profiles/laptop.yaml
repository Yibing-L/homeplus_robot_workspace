# Yibing's Ubuntu laptop: cameras and Arduino on USB, MolmoPoint local. Opening the Arduino port resets it.
serial_bridge: false
units:
  hp-tf:
    cmd: "source /opt/ros/humble/setup.bash && source ~/ros2_ws/install/setup.bash && ros2 launch homeplus_urdf_description state_publisher.launch.py use_gui:=false publish_joint_states:=false"
  hp-vision:
    cmd: "source /opt/ros/humble/setup.bash && source ~/ros2_ws/install/setup.bash && ros2 launch homeplus_vision vision_pipeline.launch.py side_mount:=left task_id:=1 enable_d405:=true enable_target_detection:=true enable_gesture_detection:=false"
  hp-moveit:
    cmd: "source /opt/ros/humble/setup.bash && source ~/ros2_ws/install/setup.bash && ros2 launch homeplus_moveit_config gesture_control.launch.py run_arduino:=false launch_obstacle_cloud:=false use_octomap:=true"
  hp-bridge:
    cmd: "source /opt/ros/humble/setup.bash && source ~/ros2_ws/install/setup.bash && ros2 run homeplus_moveit_config arduino_reader.py --port /dev/ttyACM0 --baud 115200 --ros-args -r __node:=arduino_bridge"
