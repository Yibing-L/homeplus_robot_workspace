gesture_motion_executor:
  ros__parameters:
    execution_map_path: ""
    command_topic: "/gesture_control/command"
    status_topic: "/gesture_control/executor_status"
    target_pose_topic: "/gesture_control/target_pose"
    joint_target_topic: "/gesture_control/joint_target"
    gripper_target_topic: "/gesture_control/gripper_target"
    joint_states_topic: "/hardware/joint_states"

    enable_moveit_planning: true
    move_group_action_name: "/move_action"
    default_group_name: "base_arm"
    # Select a base pose with feasible arm continuation, move it, then replan
    # from measured feedback. Contact stages keep the base fixed.
    execution_order: "staged"
    planning_service_name: "/plan_kinematic_path"
    end_effector_link: "grasp_tcp"
    base_frame: "world"
    planner_id: "RRTConnectkConfigDefault"
    plan_only: true
    allowed_planning_time: 5.0
    num_planning_attempts: 3
    wait_for_gripper_ack: true
    wait_for_trajectory_ack: true
    # The current firmware expects the complete comma-delimited trajectory in
    # one line; newline streaming resets its queue for every waypoint.
    stream_trajectory_waypoints: false
    pretty_print_trajectory_waypoints: true
    arduino_wait_progress_sec: 2.0
    display_planned_path_topic: "/display_planned_path"
    require_trajectory_approval: true
    trajectory_approval_topic: "/gesture_control/approve_planned_path"
    trajectory_approval_timeout_sec: 60.0
    position_tolerance_m: 0.05
    use_orientation_constraint: true
    orientation_tolerance_rad: 0.10
    joint_tolerance: 0.02
    workspace_bounds: [-2.0, -2.0, -1.0, 2.0, 2.0, 2.0]
    # Hardware failures always retain measured state and stop the task.
    # Setting this true is rejected at startup.
    continue_on_arduino_timeout: false
    max_start_state_error: 0.03
    detection_min_stable_samples: 1
    detection_stability_tolerance_m: 0.015
    detection_max_refresh_shift_m: 0.0  # No rejection against the earlier target
    # Rebuild from the settled, target-filtered D405 view immediately before
    # each Cartesian plan so stale moving-camera voxels cannot reject the goal.
    clear_map_before_pose_plan: true
    clear_map_service: "/nvblox/clear"
    map_clear_timeout_sec: 8.0
    map_rebuild_wait_sec: 20.0
