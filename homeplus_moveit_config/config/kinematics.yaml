# Fixed-base full-pose IK uses bounded numerical tolerance for measured base
# settling error. Task-specific position/orientation constraints are still checked.
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.15
  position_only_ik: false
  epsilon: 0.004
  collision_aware_ik: true

press_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.15
  position_only_ik: false
  epsilon: 0.004
  collision_aware_ik: true

base_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.15
  position_only_ik: false
  collision_aware_ik: true

base_press_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.15
  position_only_ik: false
