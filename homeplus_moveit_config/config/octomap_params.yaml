octomap_server:
  ros__parameters:
    # Topic that will be used to insert point clouds into OctoMap
    point_cloud_topic: '/full_cloud'

    # Frame for the octomap (typically 'map' or the fixed world frame in your setup)
    frame_id: 'hand_camera_depth_optical_frame'

    # OctoMap resolution (meters)
    resolution: 0.05

    use_sim_time: false
    # sensor filtering
    sensor_model:
      max_range: 5.0
      min_range: 0.0
      free_thresh: 0.12
      occupied_thresh: 0.97

    # optional: adjust these for faster/denser maps
    # change occupancy and integration parameters if needed
