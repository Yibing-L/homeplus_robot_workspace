commands:
  home:
    type: joint_state
    group_name: arm
    joints:
      joint_shoulder: 0.0
      joint_elbow: 0.0
      joint_wrist: 0.0
      joint_hand: 0.0

  reach_forward:
    type: pose
    frame_id: world
    group_name: arm
    position: [0.80, 0.00, 0.85]
    rpy_deg: [0.0, 0.0, 0.0]

  reach_left:
    type: pose
    frame_id: world
    group_name: arm
    position: [0.80, 0.20, 0.85]
    rpy_deg: [0.0, 0.0, 0.0]

  reach_right:
    type: pose
    frame_id: world
    group_name: arm
    position: [0.80, -0.20, 0.85]
    rpy_deg: [0.0, 0.0, 0.0]

  lift_up:
    type: pose
    frame_id: world
    group_name: arm
    position: [0.72, 0.00, 1.00]
    rpy_deg: [0.0, 0.0, 0.0]

  gripper_open:
    type: gripper
    value: 0.0

  gripper_close:
    type: gripper
    value: 90.0

  pick_up_coffee:
    type: sequence
    detection_topic: /gdino_pose_world
    detection_timeout_sec: 5.0
    steps:
      - name: open_gripper
        type: gripper
        value: 0.0

      - name: move_to_target
        type: pose
        frame_id: world
        group_name: base_arm
        target: detected
        offset_z: 0.0
        rpy_deg: [0.0, 0.0, 0.0]
        allowed_planning_time: 15.0
        num_planning_attempts: 10

      - name: close_gripper
        type: gripper
        value: 90.0

      - name: lift
        type: pose
        frame_id: world
        group_name: base_arm
        target: detected
        offset_z: 0.20
        rpy_deg: [0.0, 0.0, 0.0]
        allowed_planning_time: 15.0
        num_planning_attempts: 10
