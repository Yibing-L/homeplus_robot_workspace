commands:
  home:
    type: joint_state
    group_name: base_arm
    joints:
      base_x: 0.0
      base_y: 0.0
      base_theta: 0.0
      joint_shoulder: 0.0
      joint_elbow: 0.0
      joint_wrist: 0.0
      joint_hand: 0.0

  # Recovery only, not for routine use: raise the arm to upright without moving
  # the base or resetting the Arduino (a reset drops the arm while the firmware
  # boots, and home would also drive the base back to odometry zero). Slow and
  # endpoint-checked so the shoulder does not trip the 3 deg tracking limit.
  arm_upright:
    type: joint_state
    group_name: arm
    endpoint_profile: transit
    velocity_scaling: 0.3
    acceleration_scaling: 0.3
    require_trajectory_approval: true
    joints:
      joint_shoulder: 0.0
      joint_elbow: 0.0
      joint_wrist: 0.0
      joint_hand: 0.0

  # Hold the cup where pick_up_coffee's retreat_with_object leaves it (joint
  # values from that run, 2026-10-29): the hand camera sees the drip tray past
  # the cup there, unlike the carry pose. Start place_cup_on_drip_tray from here.
  cup_view_pose:
    type: joint_state
    group_name: arm
    endpoint_profile: transit
    velocity_scaling: 0.3
    acceleration_scaling: 0.3
    require_trajectory_approval: true
    joints:
      joint_shoulder: 0.9770
      joint_elbow: 0.2542
      joint_wrist: 0.0
      joint_hand: 1.1208

  # Drive straight back 20 cm from wherever the base stands (measured pose), arm
  # and held cup unchanged, so the hand camera gets a wider view of the scene.
  # Planned on the base group against the OctoMap with the cup attached.
  back_up:
    type: joint_state
    group_name: base
    base_relative: true
    endpoint_profile: transit
    velocity_scaling: 0.3
    acceleration_scaling: 0.3
    require_trajectory_approval: true
    joints:
      base_x: -0.20
      base_y: 0.0
      base_theta: 0.0

  reach_forward:
    type: pose
    frame_id: world
    group_name: base_arm
    position: [0.80, 0.00, 0.85]
    rpy_deg: [0.0, 0.0, 0.0]

  reach_left:
    type: pose
    frame_id: world
    group_name: base_arm
    position: [0.80, 0.20, 0.85]
    rpy_deg: [0.0, 0.0, 0.0]

  reach_right:
    type: pose
    frame_id: world
    group_name: base_arm
    position: [0.80, -0.20, 0.85]
    rpy_deg: [0.0, 0.0, 0.0]

  lift_up:
    type: pose
    frame_id: world
    group_name: base_arm
    position: [0.72, 0.00, 1.00]
    rpy_deg: [0.0, 0.0, 0.0]

  gripper_open:
    type: gripper
    value: 0.0

  gripper_close:
    type: gripper
    value: 75.0

  press_square_button:
    type: sequence
    task_id: 2
    detection_topic: /molmopoint/task_2/pose
    detection_timeout_sec: 30.0
    detection_min_stable_samples: 1
    max_replanning_attempts: 5
    steps:
      # At 70 degrees the gripper is mostly closed, leaving one forward contact
      # point available for pressing instead of an open grasp.
      - name: set_single_contact_point
        type: gripper
        value: 70.0
        max_attempts: 2
        settle_sec: 1.0

      # Always retract the arm before repositioning the mobile base. This also
      # makes a retry safe after a previous run aborted at the standoff: the
      # base cannot carry an already-extended fingertip into the appliance.
      - name: retract_arm_for_approach
        endpoint_profile: transit
        type: joint_state
        require_trajectory_approval: false
        group_name: arm
        joints:
          joint_shoulder: 0.0
          joint_elbow: 0.0
          joint_wrist: 0.0
          joint_hand: 0.0
        planner_id: RRTConnectkConfigDefault
        allowed_planning_time: 5.0
        num_planning_attempts: 3

      # Establish the pressing orientation away from the appliance before the
      # short final approach. press_tcp is the selected fingertip at gripper 70
      # and its +X points forward at world RPY 0/0/0.
      - name: move_to_button_standoff
        endpoint_profile: transit
        type: pose
        mobile_standoff: true
        lookahead_offsets: [[0.16, 0.0, 0.0]]
        require_trajectory_approval: false
        frame_id: world
        group_name: base_press_arm
        link_name: press_tcp
        target: detected
        orientation_from_detection: true
        offset_frame: target
        offset_x: -0.15
        offset_z: 0.0
        gripper_value: 70.0
        rpy_deg: [0.0, 0.0, 0.0]
        position_tolerance_m: 0.02
        use_orientation_constraint: true
        orientation_tolerance_rad: 0.05
        safe_z_candidate_offsets_m: [0.0]
        max_replanning_attempts: 3
        base_goal_tcp_x_min_m: 0.45
        base_goal_tcp_x_max_m: 0.70
        base_goal_tcp_y_max_m: 0.20
        max_base_goal_rotation_rad: 0.20
        planner_id: RRTConnectkConfigDefault
        allowed_planning_time: 10.0
        num_planning_attempts: 5

      - name: refine_button_target
        type: detect
        detection_timeout_sec: 30.0
        # The press goal is only +/-1 cm, so two samples allowed to disagree
        # by nearly 9 cm are not a meaningful stable estimate for this task.
        detection_min_stable_samples: 1
        detection_stability_tolerance_m: 0.02
        preserve_reference_z: false

      - name: align_refined_button
        type: pose
        group_name: press_arm
        link_name: press_tcp
        frame_id: world
        target: detected
        orientation_from_detection: true
        offset_frame: target
        offset_x: -0.15
        gripper_value: 70.0
        position_tolerance_m: 0.005
        orientation_tolerance_rad: 0.04
        use_orientation_constraint: true
        require_trajectory_approval: false
        clear_octomap_before_plan: true
        max_replanning_attempts: 2

      - name: press_button
        type: pose
        clear_octomap_before_plan: false
        cartesian: true
        require_trajectory_approval: false
        frame_id: world
        group_name: press_arm
        link_name: press_tcp
        target: detected
        orientation_from_detection: true
        offset_frame: target
        offset_x: 0.01
        offset_z: 0
        gripper_value: 70.0
        rpy_deg: [0.0, 0.0, 0.0]
        position_tolerance_m: 0.01
        use_orientation_constraint: true
        orientation_tolerance_rad: 0.08
        maintain_orientation_during_path: true
        safe_z_candidate_offsets_m: [0.0]
        max_replanning_attempts: 3
        planner_id: RRTConnectkConfigDefault
        allowed_planning_time: 10.0
        num_planning_attempts: 5
        post_delay_sec: 1.0

      - name: retreat_from_button
        type: pose
        clear_octomap_before_plan: false
        cartesian: true
        require_trajectory_approval: false
        frame_id: world
        group_name: press_arm
        link_name: press_tcp
        target: previous_pose
        orientation_from_detection: true
        offset_frame: target
        offset_x: -0.18
        offset_z: 0.0
        gripper_value: 70.0
        rpy_deg: [0.0, 0.0, 0.0]
        position_tolerance_m: 0.02
        use_orientation_constraint: true
        orientation_tolerance_rad: 0.08
        maintain_orientation_during_path: true
        planner_id: RRTConnectkConfigDefault
        allowed_planning_time: 10.0
        num_planning_attempts: 5

  pick_up_coffee:
    type: sequence
    task_id: 1
    detection_topic: /molmopoint/task_1/pose
    detection_timeout_sec: 30.0
    # Plan only from a consistent view: three samples whose pairwise spread is
    # within 2 cm (the lateral budget, see refine_target). Outliers delay
    # acceptance; they are never averaged in.
    detection_min_stable_samples: 3
    detection_stability_tolerance_m: 0.02
    max_replanning_attempts: 5
    steps:
      - name: open_gripper
        type: gripper
        value: 0.0

      # First plan to a standoff pose. This gives MoveIt room to avoid the
      # scene instead of forcing one long motion directly into the object.
      - name: retract_arm_for_pickup
        endpoint_profile: transit
        type: joint_state
        group_name: arm
        require_trajectory_approval: false
        joints:
          joint_shoulder: 0.0
          joint_elbow: 0.0
          joint_wrist: 0.0
          joint_hand: 0.0

      - name: move_to_pregrasp
        endpoint_profile: transit
        type: pose
        mobile_standoff: true
        # Place the base from geometry instead of searching base_arm IK: the
        # arm only moves in one vertical plane beside base_link, so the base
        # heading points that plane at the cup and the reach is the centre of
        # the interval from which the arm alone, level, covers this pre-grasp
        # and the later fixed-base steps (grasp, lift, retreat). The pose's
        # heading comes from this placement, not from the camera ray.
        base_placement:
          # Cup is round: other approach headings are fallbacks if the direct
          # one collides.
          heading_offsets_deg: [0.0, 20.0, -20.0]
          # Base settles within 5 mm (transit profile) but far vs close-up
          # detections differ by several cm: keep 3 cm of reach either way.
          min_reach_margin_m: 0.03
          joint_limit_margin_rad: 0.05
          # Shortest reach with that margin: pre-grasp TCP ~0.66 m ahead at
          # cup height ~0.78 m (centre would be ~0.76 m), so the arm lifts the
          # cup less extended. refine_target re-places the base if the
          # close-up cup is then out of arm-only reach.
          reach_preference: near
          # One combined base motion, as before. turn_then_drive exists but is
          # unused until wheel slip has been measured on hardware.
          base_motion: combined
        # Check the approach in the pre-grasp scene. Lift/retreat are checked
        # after closure with the cup attached, not as a static world obstacle.
        lookahead_offsets: [[0.19, 0.0, 0.0]]
        require_trajectory_approval: false
        frame_id: world
        group_name: base_arm
        target: detected
        orientation_from_detection: true
        offset_frame: target
        offset_x: -0.20
        offset_z: 0.0
        gripper_value: 0.0
        rpy_deg: [0.0, 0.0, 0.0]
        position_tolerance_m: 0.03
        position_tolerance_xy_m: 0.01
        position_tolerance_z_m: 0.005
        use_orientation_constraint: true
        orientation_tolerance_rad: 0.05
        planner_id: RRTConnectkConfigDefault
        allowed_planning_time: 5.0
        num_planning_attempts: 3

      - name: refine_target
        type: detect
        # The hand-mounted view can be temporarily occluded immediately after
        # motion. Wait for a stable cluster instead of accepting the first
        # low-confidence pose from a different object/background surface.
        # MolmoPoint runs asynchronously at the configured inference rate
        # (0.5 Hz), so three samples take about 6 s of the 30 s budget.
        detection_timeout_sec: 30.0
        detection_min_stable_samples: 3
        # Take Z from the close view: at ~1 m the mask misses the cup's lower
        # part and the distant height reads several cm off (0.811 vs 0.755 on
        # 2026-10-18, grasping at the rim). Close up the D405 is in range.
        preserve_reference_z: false
        # Steps 5-6 keep the base locked and cannot move the gripper sideways.
        # Closing the finger meshes on an 8 cm cup held fixed, both fingers
        # still touch it on opposite sides of its centre before 75 deg for
        # offsets up to 25 mm (tests/test_base_placement.py); 20 mm leaves
        # 5 mm for detection noise. Further off, or if the remaining arm-only
        # waypoints are out of reach from here, back off and re-place the
        # base from this close-up detection instead.
        max_arm_plane_error_m: 0.02
        redo_from_step: retract_arm_for_pickup
        max_redos: 1

      - name: align_refined_grasp
        type: pose
        group_name: arm
        # Gripper heading = measured base heading (the arm cannot yaw); the
        # refined target is taken in the arm plane (checked by refine_target).
        heading_from_base: true
        link_name: grasp_tcp
        frame_id: world
        target: detected
        orientation_from_detection: true
        offset_frame: target
        offset_x: -0.20
        gripper_value: 0.0
        position_tolerance_m: 0.005
        orientation_tolerance_rad: 0.04
        use_orientation_constraint: true
        require_trajectory_approval: false
        clear_octomap_before_plan: true
        max_replanning_attempts: 2

      - name: move_to_grasp
        type: pose
        clear_octomap_before_plan: false
        cartesian: true
        require_trajectory_approval: false
        frame_id: world
        group_name: arm
        heading_from_base: true
        target: detected
        orientation_from_detection: true
        offset_frame: target
        offset_x: -0.01
        offset_z: 0.0
        gripper_value: 0.0
        rpy_deg: [0.0, 0.0, 0.0]
        position_tolerance_m: 0.02
        position_tolerance_z_m: 0.005
        use_orientation_constraint: true
        orientation_tolerance_rad: 0.05
        maintain_orientation_during_path: true
        safe_z_candidate_offsets_m: [0.0]
        max_replanning_attempts: 3
        planner_id: RRTConnectkConfigDefault
        allowed_planning_time: 5.0
        num_planning_attempts: 3
        post_delay_sec: 3.0

      - name: close_gripper_at_target
        type: gripper
        attach_cup: true
        value: 75.0
        # Retry only if no DONE acknowledgement arrives. A successful close is
        # not repeated unnecessarily.
        max_attempts: 2
        settle_sec: 2.0

      - name: lift
        type: pose
        clear_octomap_before_plan: false
        cartesian: true
        require_trajectory_approval: false
        frame_id: world
        group_name: arm
        target: previous_pose
        orientation_from_detection: true
        offset_frame: target
        offset_x: 0.0
        offset_z: 0.10
        gripper_value: 75.0
        rpy_deg: [0.0, 0.0, 0.0]
        position_tolerance_m: 0.02
        position_tolerance_z_m: 0.005
        use_orientation_constraint: true
        orientation_tolerance_rad: 0.05
        maintain_orientation_during_path: true
        planner_id: RRTConnectkConfigDefault
        allowed_planning_time: 10.0
        num_planning_attempts: 5

      - name: retreat_with_object
        type: pose
        clear_octomap_before_plan: false
        cartesian: true
        require_trajectory_approval: false
        frame_id: world
        group_name: arm
        target: previous_pose
        orientation_from_detection: true
        offset_frame: target
        offset_x: -0.15
        offset_z: 0.0
        gripper_value: 75.0
        rpy_deg: [0.0, 0.0, 0.0]
        position_tolerance_m: 0.03
        position_tolerance_z_m: 0.005
        use_orientation_constraint: true
        orientation_tolerance_rad: 0.05
        maintain_orientation_during_path: true
        planner_id: RRTConnectkConfigDefault
        allowed_planning_time: 10.0
        num_planning_attempts: 5

  # Put the cup held after pick_up_coffee on a coffee machine's drip tray
  # (detector task 7: the centroid of the visible tray surface, at its
  # measured height). Refused unless detected_cup is attached.
  place_cup_on_drip_tray:
    type: sequence
    task_id: 7
    detection_topic: /molmopoint/task_7/pose
    detection_timeout_sec: 30.0
    detection_min_stable_samples: 3
    detection_stability_tolerance_m: 0.02
    max_replanning_attempts: 5
    # The `target: detected` offsets below place the held cup's BOTTOM CENTRE
    # relative to the tray point, not grasp_tcp. The executor converts them
    # with the cup bottom measured at grasp (detector bottom_z, stored in the
    # attached cup at closure), so offset_z 0 is the release height:
    #   grasp_tcp z = tray z + release_clearance_m + (TCP height above cup bottom at grasp)
    held_cup_placement:
      # The grasp target is the cup's detected FRONT surface
      # (cup_surface_to_center_m: 0), so the cup's axis is one cup radius at
      # grasp height further forward. Ruler-measured on the red Solo cup at
      # mid-height; if cup_surface_to_center_m is ever calibrated, subtract it.
      cup_axis_behind_grasp_point_m: 0.043  # standard 16 oz Solo cup: 6 cm base, 9.5 cm rim, 12 cm tall; held 8.8 cm up
      # Cup bottom this far above the measured tray surface when the gripper
      # opens: covers the close-up surface/bottom measurement error so the arm
      # never pushes the cup into the tray (it then drops at most this much).
      release_clearance_m: 0.01
    steps:
      # Carry pose: arm upright with the hand pitched up 0.349 rad (the
      # grasp_tcp mount pitch, palm_to_grasp_tcp) so the cup stays level;
      # the upright pose with joint_hand 0 would tilt it 20 deg forward.
      - name: retract_arm_to_carry
        endpoint_profile: transit
        type: joint_state
        group_name: arm
        require_trajectory_approval: false
        joints:
          joint_shoulder: 0.0
          joint_elbow: 0.0
          joint_wrist: 0.0
          joint_hand: 0.349066

      - name: move_to_tray_standoff
        endpoint_profile: transit
        type: pose
        mobile_standoff: true
        base_placement:
          # The tray is only reachable from the machine's front: no
          # alternative headings, unlike the round cup.
          heading_offsets_deg: [0.0]
          min_reach_margin_m: 0.03
          joint_limit_margin_rad: 0.05
          reach_preference: near
          base_motion: combined
        # Check the slide in over the tray (standoff -> above the tray).
        lookahead_offsets: [[0.20, 0.0, 0.0]]
        require_trajectory_approval: false
        frame_id: world
        group_name: base_arm
        target: detected
        orientation_from_detection: true
        offset_frame: target
        # Cup 20 cm in front of the tray point, 3 cm above the release
        # height: clear of the tray's front lip on the way in.
        offset_x: -0.20
        offset_z: 0.03
        gripper_value: 75.0
        rpy_deg: [0.0, 0.0, 0.0]
        position_tolerance_m: 0.03
        position_tolerance_xy_m: 0.01
        position_tolerance_z_m: 0.005
        use_orientation_constraint: true
        orientation_tolerance_rad: 0.05
        planner_id: RRTConnectkConfigDefault
        allowed_planning_time: 5.0
        num_planning_attempts: 3

      # No close-up re-detection: once the arm is in the carry pose the held cup
      # hides the tray from the hand camera (2026-10-29), so the sequence uses
      # the detection taken at its start, from a pose that can see past the cup.

      - name: move_over_tray
        type: pose
        clear_octomap_before_plan: false
        cartesian: true
        require_trajectory_approval: true
        frame_id: world
        group_name: arm
        heading_from_base: true
        target: detected
        orientation_from_detection: true
        offset_frame: target
        offset_x: 0.0
        offset_z: 0.03
        gripper_value: 75.0
        rpy_deg: [0.0, 0.0, 0.0]
        position_tolerance_m: 0.02
        position_tolerance_z_m: 0.005
        use_orientation_constraint: true
        orientation_tolerance_rad: 0.05
        maintain_orientation_during_path: true
        max_replanning_attempts: 3
        planner_id: RRTConnectkConfigDefault
        allowed_planning_time: 5.0
        num_planning_attempts: 3

      # Straight down to the release height (offset_z 0, see above).
      - name: lower_cup_onto_tray
        type: pose
        clear_octomap_before_plan: false
        cartesian: true
        require_trajectory_approval: true
        frame_id: world
        group_name: arm
        heading_from_base: true
        target: detected
        orientation_from_detection: true
        offset_frame: target
        offset_x: 0.0
        offset_z: 0.0
        gripper_value: 75.0
        rpy_deg: [0.0, 0.0, 0.0]
        position_tolerance_m: 0.02
        position_tolerance_z_m: 0.005
        use_orientation_constraint: true
        orientation_tolerance_rad: 0.05
        maintain_orientation_during_path: true
        max_replanning_attempts: 3
        planner_id: RRTConnectkConfigDefault
        allowed_planning_time: 5.0
        num_planning_attempts: 3
        post_delay_sec: 1.0

      # Detaches detected_cup. Fingers<->OctoMap contact stays allowed until
      # the command ends: the open fingers still surround the placed cup.
      - name: release_cup
        type: gripper
        detach_cup: true
        value: 0.0
        max_attempts: 2
        settle_sec: 1.0

      # Straight back first: the machine's spout is above the cup.
      - name: retreat_from_cup
        type: pose
        clear_octomap_before_plan: false
        cartesian: true
        require_trajectory_approval: false
        frame_id: world
        group_name: arm
        target: previous_pose
        orientation_from_detection: true
        offset_frame: target
        offset_x: -0.15
        offset_z: 0.0
        gripper_value: 0.0
        rpy_deg: [0.0, 0.0, 0.0]
        position_tolerance_m: 0.03
        position_tolerance_z_m: 0.005
        use_orientation_constraint: true
        orientation_tolerance_rad: 0.05
        maintain_orientation_during_path: true
        planner_id: RRTConnectkConfigDefault
        allowed_planning_time: 10.0
        num_planning_attempts: 5

      - name: retract_arm_after_place
        endpoint_profile: transit
        type: joint_state
        group_name: arm
        require_trajectory_approval: false
        joints:
          joint_shoulder: 0.0
          joint_elbow: 0.0
          joint_wrist: 0.0
          joint_hand: 0.0
