commands:
  home:
    type: joint_state
    group_name: base_arm
    joints:
      base_x: 0.0
      base_y: 0.0
      base_theta: 0.0
      joint_shoulder: 0.0
      joint_elbow: 0.0
      joint_wrist: 0.0
      joint_hand: 0.0

  reach_forward:
    type: pose
    frame_id: world
    group_name: base_arm
    position: [0.80, 0.00, 0.85]
    rpy_deg: [0.0, 0.0, 0.0]

  reach_left:
    type: pose
    frame_id: world
    group_name: base_arm
    position: [0.80, 0.20, 0.85]
    rpy_deg: [0.0, 0.0, 0.0]

  reach_right:
    type: pose
    frame_id: world
    group_name: base_arm
    position: [0.80, -0.20, 0.85]
    rpy_deg: [0.0, 0.0, 0.0]

  lift_up:
    type: pose
    frame_id: world
    group_name: base_arm
    position: [0.72, 0.00, 1.00]
    rpy_deg: [0.0, 0.0, 0.0]

  gripper_open:
    type: gripper
    value: 0.0

  gripper_close:
    type: gripper
    value: 90.0

  pick_up_coffee:
    type: sequence
    detection_topic: /gdino_pose_world
    detection_timeout_sec: 5.0
    # Temporary test override: treat the cup as fixed in world frame.
    hardcoded_detection_pose:
      frame_id: world
      position: [0.90, 0.30, 0.78]
      rpy_deg: [0.0, 0.0, 0.0]
    steps:
      - name: open_gripper
        type: gripper
        value: 0.0

      - name: move_to_target
        type: pose
        frame_id: world
        group_name: base_arm
        target: detected
        offset_x: -0.03
        offset_z: -0.03
        gripper_value: 0.0
        rpy_deg: [0.0, 0.0, 0.0]
        use_orientation_constraint: true
        orientation_tolerance_rad: 0.01
        planner_id: RRTConnectkConfigDefault
        allowed_planning_time: 15.0
        num_planning_attempts: 10
        # Arduino DONE can arrive before the physical trajectory has settled.
        # Keep the gripper open and wait before sending the close command.
        post_delay_sec: 3.0

      - name: close_gripper_at_target
        type: gripper
        value: 90.0

      - name: lift
        type: pose
        frame_id: world
        group_name: base_arm
        target: detected
        offset_x: -0.03
        offset_z: 0.20
        rpy_deg: [0.0, 0.0, 0.0]
        use_orientation_constraint: true
        orientation_tolerance_rad: 0.01
        planner_id: RRTConnectkConfigDefault
        allowed_planning_time: 15.0
        num_planning_attempts: 10
